name: CI

# Keep this metadata protocol in sync with the default-branch retest router.
run-name: >-
  ${{ github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false &&
      contains(github.event.pull_request.labels.*.name, 'ready') &&
      ((github.event.action != 'labeled' && github.event.action != 'unlabeled') ||
       github.event.label.name == 'ready') &&
      format('ci-meta:v1;run={0};pr={1};base={2};base_sha={3};merge_sha={4}',
             github.run_id,
             github.event.pull_request.number,
             github.event.pull_request.base.ref,
             github.event.pull_request.base.sha,
             github.sha) ||
      format('{0}:{1}@{2}', github.event_name, github.ref_name, github.sha) }}

on:
  pull_request:
    branches: [main]
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - converted_to_draft
      - labeled
      - unlabeled
  workflow_dispatch:

concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.event_name }}-${{
      github.event.pull_request.number || github.ref
    }}-${{
      (github.event.action == 'labeled' || github.event.action == 'unlabeled') &&
      github.event.label.name != 'ready' &&
      format('ignored-{0}', github.run_id) || 'ci'
    }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

env:
  POLICY_TARGET_BRANCH: ${{ github.event.pull_request.base.ref || github.base_ref || github.ref_name }}
  # Use PCI order; the standalone UUID check verifies actual device identity.
  CUDA_DEVICE_ORDER: PCI_BUS_ID

jobs:
  docs-scope:
    name: Classify documentation changes
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.base.ref == 'main' &&
      contains(github.event.pull_request.labels.*.name, 'ready') &&
      ((github.event.action != 'labeled' && github.event.action != 'unlabeled') ||
       github.event.label.name == 'ready')
    runs-on: ubuntu-latest
    outputs:
      docs-only: ${{ steps.classify.outputs.docs-only }}
      files: ${{ steps.classify.outputs.files }}
    steps:
      - name: Classify using base-owned code
        id: classify
        uses: actions/github-script@v7
        with:
          script: |
            // If the base predates this helper or classification is uncertain,
            // retain the complete gate rather than treating the PR as docs-only.
            try {
              const fs = require('fs');
              const path = require('path');
              const {owner, repo} = context.repo;
              const pr = context.payload.pull_request;
              const ref = pr && pr.base && pr.base.sha;
              if (!/^[0-9a-f]{40}$/i.test(ref || '')) throw new Error('Missing pinned base SHA');
              const {data} = await github.rest.repos.getContent({
                owner, repo, path: 'tools/ci/docs_only.js', ref,
              });
              if (!data || Array.isArray(data) || data.type !== 'file' ||
                  data.encoding !== 'base64' || typeof data.content !== 'string' ||
                  !Number.isSafeInteger(data.size) || data.size < 0 || data.size > 1048576) {
                throw new Error('Base documentation classifier is unavailable or invalid');
              }
              const encoded = data.content.replace(/\s/g, '');
              if (!/^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$/.test(encoded)) {
                throw new Error('Invalid documentation classifier encoding');
              }
              const bytes = Buffer.from(encoded, 'base64');
              if (bytes.length !== data.size || !Buffer.from(bytes.toString('utf8'), 'utf8').equals(bytes)) {
                throw new Error('Invalid documentation classifier content');
              }
              const dir = fs.mkdtempSync(path.join(process.env.RUNNER_TEMP, 'docs-classifier-'));
              const classifierPath = path.join(dir, 'docs_only.js');
              fs.writeFileSync(classifierPath, bytes, {mode: 0o600});
              const {classify} = require(classifierPath);
              if (typeof classify !== 'function') throw new Error('Invalid documentation classifier');
              const result = await classify({github, context, core});
              if (!result || typeof result.docsOnly !== 'boolean' || !Array.isArray(result.files) ||
                  result.files.some(file => typeof file !== 'string')) {
                throw new Error('Invalid documentation classification');
              }
              core.setOutput('docs-only', result.docsOnly ? 'true' : 'false');
              core.setOutput('files', JSON.stringify(result.files));
            } catch (error) {
              core.warning(`Documentation classification unavailable; running full CI: ${error.message}`);
              core.setOutput('docs-only', 'false');
              core.setOutput('files', '[]');
            }

  docs-check:
    name: Documentation checks
    needs: docs-scope
    if: >-
      needs.docs-scope.result == 'success' && needs.docs-scope.outputs.docs-only == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Verify checked out PR merge
        env:
          EXPECTED_MERGE_SHA: ${{ github.sha }}
        run: |
          [[ "$EXPECTED_MERGE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_MERGE_SHA" ]]
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pre-commit
        run: python -m pip install pre-commit==4.6.2
      - name: Run documentation hooks
        env:
          DOC_FILES_JSON: ${{ needs.docs-scope.outputs.files }}
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess

          files = json.loads(os.environ["DOC_FILES_JSON"])
          if not isinstance(files, list) or not all(isinstance(p, str) for p in files):
              raise SystemExit("Invalid documentation file list")
          # Deletions are excluded by the classifier. Reject missing files and
          # symlinks rather than silently passing an incomplete check.
          for path in files:
              if not path or os.path.isabs(path) or ".." in path.split("/") or os.path.islink(path) or not os.path.isfile(path):
                  raise SystemExit(f"Invalid or unavailable documentation file: {path!r}")
          # This hook checks all tracked paths, even for deletion-only PRs.
          subprocess.run(
              ["pre-commit", "run", "check-filenames", "--all-files",
               "--show-diff-on-failure"],
              check=True,
          )
          if not files:
              print("Documentation-only deletion: no remaining files to lint.")
          else:
              for hook in (
                  "markdownlint", "check-characters", "typos",
                  "end-of-file-fixer", "trailing-whitespace", "mixed-line-ending",
              ):
                  # Prefix names with ./ so even a leading dash is a filename.
                  subprocess.run(
                      ["pre-commit", "run", hook, "--show-diff-on-failure",
                       "--files", *["./" + path for path in files]],
                      check=True,
                  )
          PY

  benchmark-policy:
    name: Resolve benchmark policy
    needs: docs-scope
    if: >-
      !cancelled() && needs.docs-scope.outputs.docs-only != 'true' &&
      (github.event_name != 'pull_request' ||
      (github.event.pull_request.draft == false &&
       github.event.pull_request.base.ref == 'main' &&
       contains(github.event.pull_request.labels.*.name, 'ready') &&
       ((github.event.action != 'labeled' && github.event.action != 'unlabeled') ||
        github.event.label.name == 'ready')))
    # Resolve device overrides on the same runner class used by the gates.
    runs-on: self-hosted
    outputs:
      policy-json: ${{ steps.benchmark-policy.outputs.policy-json }}
    steps:
      # Resolve policy and execute tests from the same immutable workflow commit.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install policy parser dependency
        run: python -I -m pip install 'PyYAML>=6.0'

      - name: Resolve benchmark policy
        id: benchmark-policy
        env:
          POLICY_REF: ${{ github.sha }}
        run: |
          device="gpu"
          board_id="unknown"
          if command -v npu-smi > /dev/null 2>&1; then
            device="npu"
            board_id="$(
              python -I -c 'import os, sys; sys.path.insert(0, os.path.join(os.environ.get("ASCEND_TOOLKIT_HOME", "/usr/local/Ascend/ascend-toolkit/latest"), "python/site-packages")); import acl; print(acl.get_soc_name())' \
                2>/dev/null || echo unknown
            )"
          fi

          if [[ "$POLICY_TARGET_BRANCH" == "main" ||
                ( "${GITHUB_EVENT_NAME:-}" == "workflow_dispatch" && "$POLICY_TARGET_BRANCH" == "decode_graph" ) ]]; then
            # Preserve the manual decode_graph profile alongside main PR validation.
            if [[ "$device" == "npu" && "$board_id" == "Ascend910_9362" ]]; then
              board_id="decode_graph_Ascend910_9362"
            else
              board_id="decode_graph_${device}"
            fi
          fi

          args=(
            --device "$device"
            --board-id "$board_id"
            --source-ref "$POLICY_REF"
            --github-output "$GITHUB_OUTPUT"
            --github-step-summary "$GITHUB_STEP_SUMMARY"
          )
          args+=(--policy-file .github/benchmark-gate.yaml)
          python -I tools/ci/resolve_benchmark_policy.py "${args[@]}"

  pre-commit:
    name: Device tests
    needs: benchmark-policy
    if: needs.benchmark-policy.result == 'success'
    runs-on: self-hosted
    env:
      VLLM_GR_TEST_LEVEL: pr-device
      VLLM_GR_ISOLATED_RUNNER: ${{ vars.VLLM_GR_ISOLATED_RUNNER || 'false' }}
      # Activate the opt-in tiny-model smoke tests (graph/eager parity and the
      # dynamic-beam CPU-oracle comparison) that L2 now collects per PR.
      VLLM_GR_RUN_MODEL_SMOKE: '1'
    concurrency:
      group: vllm-gr-accelerator-${{ github.repository }}
      queue: max
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v1

      - name: Resolve candidate runtime
        id: runtime
        env:
          RUNTIME_DEVICE: ${{ fromJSON(needs.benchmark-policy.outputs.policy-json).BENCHMARK_DEVICE }}
        run: >-
          python tools/ci/resolve_runtime.py resolve
          --device "$RUNTIME_DEVICE"
          --output "$RUNNER_TEMP/gr-runtime-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}/spec.json"
          --github-output "$GITHUB_OUTPUT"
          --github-env "$GITHUB_ENV"

      - name: Cache virtual environment
        uses: corca-ai/local-cache@v2
        id: cache-venv
        with:
          path: .venv
          base: /data/actions/cache
          key: ${{ steps.runtime.outputs.cache-key }}

      - name: Create virtual environment
        if: steps.cache-venv.outputs.cache-hit != 'true'
        run: |
          if [[ "$VLLM_GR_TARGET_DEVICE" == "npu" ]]; then
            # The selected base Python must already contain the vendor runtime.
            uv venv --seed --system-site-packages .venv
          else
            uv venv --seed .venv
          fi

      - name: Set up virtual environment
        run: |
          echo "${{ github.workspace }}/.venv/bin" >> "$GITHUB_PATH"
          {
            echo "VIRTUAL_ENV=${{ github.workspace }}/.venv"
            echo "CI_CUDA_MAPPING_FILE=$RUNNER_TEMP/cuda-mapping-${GITHUB_JOB}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json"
          } >> "$GITHUB_ENV"

      - name: Install CUDA base environment
        if: >-
          steps.cache-venv.outputs.cache-hit != 'true' &&
          env.VLLM_GR_TARGET_DEVICE == 'cuda'
        run: uv pip install "$CI_VLLM_REQUIREMENT"

      # The editable package version depends on Git HEAD. Refresh this package on reused runners.
      - name: Refresh editable installation
        run: |
          export VLLM_GR_TARGET_DEVICE="${VLLM_GR_TARGET_DEVICE:-cuda}"
          uv pip install --reinstall-package vllm-gr -e ".[dev,grpc]"

      - name: Verify gRPC runtime dependencies
        run: |
          python -c 'from vllm_gr.entrypoints.grpc.generated import vllm_engine_pb2, vllm_engine_pb2_grpc; from vllm_gr.entrypoints.grpc.serving import BeamVllmEngineServicer'

      - name: Verify installed runtime identity
        run: >-
          python tools/ci/resolve_runtime.py verify
          --spec "$RUNNER_TEMP/gr-runtime-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}/spec.json"
          --venv "$VIRTUAL_ENV"
          --output "$RUNNER_TEMP/gr-runtime-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}/installed.json"
          --cache-root "$RUNNER_TEMP/gr-build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}"
          --github-env "$GITHUB_ENV"

      - name: Verify CUDA device mapping before cleanup
        id: cuda-mapping
        run: |
          python tools/ci/check_cuda_device_mapping.py --output "$CI_CUDA_MAPPING_FILE"
          echo "PYTHONPATH=$GITHUB_WORKSPACE/tools/ci${PYTHONPATH:+:$PYTHONPATH}" >> "$GITHUB_ENV"

      - name: Kill stale process on device
        run: bash ./scripts/kill_vllm_on_device.sh --yes

      - name: Run device tests
        env:
          VLLM_GR_EXCLUDE_MIGRATED_GPU_TESTS: "1"
        run: bash tools/ci/run_test_level.sh "$VLLM_GR_TEST_LEVEL"

      - name: Run L2 resource probe if isolated
        run: bash tools/ci/run_resource_level.sh

      - name: Check clear device
        if: always() && steps.cuda-mapping.outcome == 'success'
        run: bash ./scripts/check_vllm_on_device.sh

  decode-benchmark:
    name: ${{ github.event_name == 'pull_request' && 'NPU decode benchmark' || 'Decode benchmark' }}
    # The shared GPU concurrency group serializes device-intensive jobs.
    needs: [benchmark-policy, pre-commit]
    if: >-
      ${{ !cancelled() &&
      needs.benchmark-policy.result == 'success' &&
      needs.pre-commit.result == 'success' &&
      (github.event_name != 'pull_request' ||
       fromJSON(needs.benchmark-policy.outputs.policy-json).BENCHMARK_DEVICE != 'gpu') }}
    runs-on: self-hosted
    concurrency:
      group: vllm-gr-accelerator-${{ github.repository }}
      queue: max
      cancel-in-progress: false
    env:
      BENCHMARK_POLICY_NAME: ${{ fromJSON(needs.benchmark-policy.outputs.policy-json).BENCHMARK_POLICY_NAME }}
      BENCHMARK_DEVICE: ${{ fromJSON(needs.benchmark-policy.outputs.policy-json).BENCHMARK_DEVICE }}
      ACCURACY_FAILURE_MODE: ${{ fromJSON(needs.benchmark-policy.outputs.policy-json).ACCURACY_FAILURE_MODE }}
      P99_TTFT_FAILURE_MODE: ${{ fromJSON(needs.benchmark-policy.outputs.policy-json).P99_TTFT_FAILURE_MODE }}
      P99_TPOT_FAILURE_MODE: ${{ fromJSON(needs.benchmark-policy.outputs.policy-json).P99_TPOT_FAILURE_MODE }}
      ONLINE_ELAPSED_FAILURE_MODE: ${{ fromJSON(needs.benchmark-policy.outputs.policy-json).ONLINE_ELAPSED_FAILURE_MODE }}
      OFFLINE_ELAPSED_FAILURE_MODE: ${{ fromJSON(needs.benchmark-policy.outputs.policy-json).OFFLINE_ELAPSED_FAILURE_MODE }}
      PASS_AT_1_THRESHOLD: ${{ fromJSON(needs.benchmark-policy.outputs.policy-json).PASS_AT_1_THRESHOLD }}
      PASS_AT_32_THRESHOLD: ${{ fromJSON(needs.benchmark-policy.outputs.policy-json).PASS_AT_32_THRESHOLD }}
      RECALL_AT_32_THRESHOLD: ${{ fromJSON(needs.benchmark-policy.outputs.policy-json).RECALL_AT_32_THRESHOLD }}
      ELAPSED_TIME_ONLINE_THRESHOLD: ${{ fromJSON(needs.benchmark-policy.outputs.policy-json).ELAPSED_TIME_ONLINE_THRESHOLD }}
      ELAPSED_TIME_OFFLINE_THRESHOLD: ${{ fromJSON(needs.benchmark-policy.outputs.policy-json).ELAPSED_TIME_OFFLINE_THRESHOLD }}
      P99_TTFT_THRESHOLD: ${{ fromJSON(needs.benchmark-policy.outputs.policy-json).P99_TTFT_THRESHOLD }}
      P99_TPOT_THRESHOLD: ${{ fromJSON(needs.benchmark-policy.outputs.policy-json).P99_TPOT_THRESHOLD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v1

      - name: Resolve candidate runtime
        id: runtime
        env:
          RUNTIME_DEVICE: ${{ fromJSON(needs.benchmark-policy.outputs.policy-json).BENCHMARK_DEVICE }}
        run: >-
          python tools/ci/resolve_runtime.py resolve
          --device "$RUNTIME_DEVICE"
          --output "$RUNNER_TEMP/gr-runtime-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}/spec.json"
          --github-output "$GITHUB_OUTPUT"
          --github-env "$GITHUB_ENV"

      - name: Restore virtual environment
        uses: corca-ai/local-cache@v2
        id: cache-venv
        with:
          path: .venv
          base: /data/actions/cache
          key: ${{ steps.runtime.outputs.cache-key }}

      - name: Create virtual environment
        if: steps.cache-venv.outputs.cache-hit != 'true'
        run: |
          if [[ "$VLLM_GR_TARGET_DEVICE" == "npu" ]]; then
            uv venv --seed --system-site-packages .venv
          else
            uv venv --seed .venv
          fi

      - name: Set up virtual environment
        run: |
          echo "${{ github.workspace }}/.venv/bin" >> "$GITHUB_PATH"
          {
            echo "VIRTUAL_ENV=${{ github.workspace }}/.venv"
            echo "CI_CUDA_MAPPING_FILE=$RUNNER_TEMP/cuda-mapping-${GITHUB_JOB}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json"
          } >> "$GITHUB_ENV"

      - name: Install CUDA base environment
        if: >-
          steps.cache-venv.outputs.cache-hit != 'true' &&
          env.VLLM_GR_TARGET_DEVICE == 'cuda'
        run: uv pip install "$CI_VLLM_REQUIREMENT"

      - name: Refresh editable installation
        run: |
          export VLLM_GR_TARGET_DEVICE="${VLLM_GR_TARGET_DEVICE:-cuda}"
          uv pip install --reinstall-package vllm-gr -e ".[dev]"

      - name: Verify installed runtime identity
        run: >-
          python tools/ci/resolve_runtime.py verify
          --spec "$RUNNER_TEMP/gr-runtime-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}/spec.json"
          --venv "$VIRTUAL_ENV"
          --output "$RUNNER_TEMP/gr-runtime-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}/installed.json"
          --cache-root "$RUNNER_TEMP/gr-build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}"
          --github-env "$GITHUB_ENV"

      - name: Verify CUDA device mapping before cleanup
        id: cuda-mapping
        run: |
          python tools/ci/check_cuda_device_mapping.py --output "$CI_CUDA_MAPPING_FILE"
          echo "PYTHONPATH=$GITHUB_WORKSPACE/tools/ci${PYTHONPATH:+:$PYTHONPATH}" >> "$GITHUB_ENV"

      - name: Kill stale process on device
        run: bash ./scripts/kill_vllm_on_device.sh --yes

      - name: Cache OpenOneRec dataset
        uses: corca-ai/local-cache@v2
        id: cache-dataset
        with:
          path: OpenOneRec
          base: /data/actions/cache
          key: dataset-openonerec-${{ runner.os }}

      - name: Download OpenOneRec dataset
        if: steps.cache-dataset.outputs.cache-hit != 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [[ -z "$HF_TOKEN" ]]; then
            echo "HF_TOKEN is required for the gated OpenOneRec dataset." >&2
            exit 1
          fi
          uv tool install hf
          mkdir -p OpenOneRec
          hf download OpenOneRec/OpenOneRec-RecIF \
            --token "$HF_TOKEN" \
            --local-dir ./OpenOneRec \
            --repo-type=dataset

      - name: Build catalog
        run: |
          mkdir -p generated_data
          python ./benchmarks/open_one_rec/tools/create_task_catalog.py \
            -t video \
            -d ./OpenOneRec/benchmark_data \
            -o generated_data/video_catalog.json
          python ./tools/constraints/build_constraint_triples.py \
            --catalog generated_data/video_catalog.json \
            --output generated_data/video_constraint_triples.json \
            --begin "<|sid_begin|>" \
            --end "<|sid_end|>"

      - name: Cache OneRec Recall constraint tables
        if: >-
          (env.POLICY_TARGET_BRANCH == 'main' ||
           (github.event_name == 'workflow_dispatch' && env.POLICY_TARGET_BRANCH == 'decode_graph')) &&
          env.BENCHMARK_DEVICE == 'gpu'
        uses: corca-ai/local-cache@v2
        id: cache-recall-constraints
        with:
          path: generated_data/recall_constraints
          base: /data/actions/cache
          key: onerec-recall-constraints-v1-${{ runner.os }}-${{ hashFiles('OpenOneRec/benchmark_data/sid2pid.json', 'OpenOneRec/benchmark_data/sid2iid.json') }}

      - name: Build OneRec Recall constraint tables
        if: >-
          (env.POLICY_TARGET_BRANCH == 'main' ||
           (github.event_name == 'workflow_dispatch' && env.POLICY_TARGET_BRANCH == 'decode_graph')) &&
          env.BENCHMARK_DEVICE == 'gpu' &&
          steps.cache-recall-constraints.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p generated_data/recall_constraints
          for mapping in sid2pid sid2iid; do
            python benchmarks/open_one_rec/tools/convert_catalog.py \
              --dataset-path OpenOneRec/benchmark_data \
              --mapping-file "$mapping.json" \
              --output-path "generated_data/recall_constraints/$mapping-catalog.json"
            python tools/constraints/build_constraint_triples.py \
              --catalog "generated_data/recall_constraints/$mapping-catalog.json" \
              --output "generated_data/recall_constraints/${mapping}_triples.json" \
              --begin '<|sid_begin|>' \
              --end '<|sid_end|>'
            rm "generated_data/recall_constraints/$mapping-catalog.json"
          done

      - name: Gate Beam V1 B=4 OneRec Recall on fixed samples
        if: >-
          (env.POLICY_TARGET_BRANCH == 'main' ||
           (github.event_name == 'workflow_dispatch' && env.POLICY_TARGET_BRANCH == 'decode_graph')) &&
          env.BENCHMARK_DEVICE == 'gpu'
        env:
          V1_RECALL_DATASET_PATH: ${{ github.workspace }}/OpenOneRec/benchmark_data
          V1_RECALL_OUTPUT_DIR: ${{ github.workspace }}/v1_recall_results
          V1_RECALL_BASELINE_FILE: ${{ github.workspace }}/benchmarks/beam_search/recall_baseline_batch4.json
          V1_RECALL_DIAGNOSTICS: '1'
        run: bash ./tests/system/run_beam_v1_recall.sh

      - name: Upload Beam V1 Recall measurements
        if: >-
          always() &&
          (env.POLICY_TARGET_BRANCH == 'main' ||
           (github.event_name == 'workflow_dispatch' && env.POLICY_TARGET_BRANCH == 'decode_graph')) &&
          env.BENCHMARK_DEVICE == 'gpu'
        uses: actions/upload-artifact@v4
        with:
          name: beam-v1-recall-${{ github.run_id }}-${{ github.run_attempt }}
          path: v1_recall_results
          if-no-files-found: warn
          retention-days: 14

      - name: Execute decode benchmark gates
        if: >-
          env.BENCHMARK_DEVICE != 'gpu' ||
          !(env.POLICY_TARGET_BRANCH == 'main' ||
           (github.event_name == 'workflow_dispatch' && env.POLICY_TARGET_BRANCH == 'decode_graph'))
        env:
          DATASET_PATH: ${{ github.workspace }}/OpenOneRec/benchmark_data
          CATALOG_PATH: ${{ github.workspace }}/generated_data/video_catalog.json
          TRIPLES_PATH: ${{ github.workspace }}/generated_data/video_constraint_triples.json
        run: ./tests/system/run_benchmark_and_verify.sh

      - name: Check clear device
        if: always() && steps.cuda-mapping.outcome == 'success'
        run: bash ./scripts/check_vllm_on_device.sh

  benchmark-blocking:
    name: Benchmark blocking gate
    needs: [docs-scope, docs-check, benchmark-policy, pre-commit, decode-benchmark]
    if: >-
      always() &&
      (github.event_name != 'pull_request' ||
       (github.event.action != 'labeled' && github.event.action != 'unlabeled') ||
       github.event.label.name == 'ready')
    runs-on: ubuntu-latest
    steps:
      - name: Revalidate documentation classification
        if: needs.docs-scope.outputs.docs-only == 'true'
        uses: actions/github-script@v7
        env:
          EXPECTED_DOC_FILES: ${{ needs.docs-scope.outputs.files }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const {owner, repo} = context.repo;
            const pr = context.payload.pull_request;
            const ref = pr && pr.base && pr.base.sha;
            if (!/^[0-9a-f]{40}$/i.test(ref || '')) throw new Error('Missing pinned base SHA');
            const {data} = await github.rest.repos.getContent({
              owner, repo, path: 'tools/ci/docs_only.js', ref,
            });
            if (!data || Array.isArray(data) || data.type !== 'file' ||
                data.encoding !== 'base64' || typeof data.content !== 'string' ||
                !Number.isSafeInteger(data.size) || data.size < 0 || data.size > 1048576) {
              throw new Error('Base documentation classifier is unavailable or invalid');
            }
            const encoded = data.content.replace(/\s/g, '');
            if (!/^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$/.test(encoded)) {
              throw new Error('Invalid documentation classifier encoding');
            }
            const bytes = Buffer.from(encoded, 'base64');
            if (bytes.length !== data.size || !Buffer.from(bytes.toString('utf8'), 'utf8').equals(bytes)) {
              throw new Error('Invalid documentation classifier content');
            }
            const dir = fs.mkdtempSync(path.join(process.env.RUNNER_TEMP, 'docs-classifier-'));
            const classifierPath = path.join(dir, 'docs_only.js');
            fs.writeFileSync(classifierPath, bytes, {mode: 0o600});
            const {classify} = require(classifierPath);
            if (typeof classify !== 'function') throw new Error('Invalid documentation classifier');
            const result = await classify({github, context, core});
            if (!result || typeof result.docsOnly !== 'boolean' || !Array.isArray(result.files) ||
                result.files.some(file => typeof file !== 'string')) {
              throw new Error('Invalid documentation classification');
            }
            if (!result.docsOnly ||
                JSON.stringify(result.files) !== process.env.EXPECTED_DOC_FILES) {
              throw new Error('Documentation classification changed; rerun the workflow');
            }

      - name: Require every blocking check to pass
        env:
          DOCS_ONLY: ${{ needs.docs-scope.outputs.docs-only }}
          DOCS_RESULT: ${{ needs.docs-check.result }}
          POLICY_RESULT: ${{ needs.benchmark-policy.result }}
          PRE_COMMIT_RESULT: ${{ needs.pre-commit.result }}
          DECODE_RESULT: ${{ needs.decode-benchmark.result }}
          DECODE_REQUIRED: >-
            ${{ github.event_name != 'pull_request' ||
                needs.benchmark-policy.result != 'success' ||
                fromJSON(needs.benchmark-policy.outputs.policy-json).BENCHMARK_DEVICE != 'gpu' }}
        run: |
          if [[ "$DOCS_ONLY" == true ]]; then
            echo "DOCS_RESULT=$DOCS_RESULT"
            if [[ "$DOCS_RESULT" != success ]]; then
              echo "::error::Documentation checks did not pass."
              exit 1
            fi
            exit 0
          fi
          # A skipped required check still fails the gate: an unrun check is not
          # a pass. Report the jobs that actually failed first and mark the rest
          # as blocked by them to distinguish failures from checks that could
          # not run.
          failed_jobs=()
          skipped_jobs=()
          required_results=(POLICY_RESULT PRE_COMMIT_RESULT)
          if [[ "$DECODE_REQUIRED" == true ]]; then
            required_results+=(DECODE_RESULT)
          fi
          for result_name in "${required_results[@]}"; do
            result="${!result_name}"
            echo "$result_name=$result"
            if [[ "$result" == "failure" || "$result" == "cancelled" ]]; then
              failed_jobs+=("$result_name:$result")
            elif [[ "$result" != "success" ]]; then
              skipped_jobs+=("$result_name:$result")
            fi
          done
          if (( ${#failed_jobs[@]} > 0 )); then
            printf '::error::%s failed and blocked the gate: %s\n' \
              "${failed_jobs[0]%%:*}" "${failed_jobs[*]}"
          fi
          if (( ${#skipped_jobs[@]} > 0 )); then
            if (( ${#failed_jobs[@]} > 0 )); then
              printf '::error::Not evaluated because %s failed: %s\n' \
                "${failed_jobs[0]%%:*}" "${skipped_jobs[*]}"
            else
              printf '::error::Required validations did not run: %s. Skipped validation is not a pass.\n' \
                "${skipped_jobs[*]}"
            fi
          fi
          if (( ${#failed_jobs[@]} > 0 || ${#skipped_jobs[@]} > 0 )); then
            exit 1
          fi
          exit 0

      - name: Reject cancelled workflow
        if: cancelled()
        run: |
          echo "::error::Cancelled CI cannot satisfy the blocking gate."
          exit 1
